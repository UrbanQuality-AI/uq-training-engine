[tool.poetry]
package-mode = true
packages = [{ include = "uq_training_engine", from = "src" }]

[project]
name = "uq-training-engine"
version = "0.1.0"
description = "Training engine for urban quality preference modeling with ViT backbones, pairwise ranking loss, and TrueSkill-based auxiliary targets."
requires-python = ">=3.12,<3.15"
authors = [{ name = "Antek-N", email = "antek.nikolajdu@gmail.com" }]
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
uq-train = "uq_training_engine.__main__:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
torch = "^2.4.0"
torchvision = "^0.19.0"
timm = "^1.0.0"
numpy = "^2.0.0"
pandas = "^2.2.0"
pillow = "^10.0.0"
joblib = "^1.4.0"
scikit-learn = "^1.5.0"
scipy = "^1.13.0"
optuna = "^4.0.0"
trueskill = "^0.4.5"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ruff = "^0.12.12"
mypy = "^1.17.1"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
fix = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "^tests/"
